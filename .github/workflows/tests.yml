# The test suite, on every pull request: merge only when this check is green.
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: A venv with setuptools, so the wheel is built and installed too
        run: python3 -m venv /tmp/v && /tmp/v/bin/pip install -q "setuptools>=77"
      - run: PATH=/tmp/v/bin:$PATH make check
